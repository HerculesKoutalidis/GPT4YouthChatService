version: '3.8'

services:
  # 1. THE LLM ENGINE
  vllm-engine:
    image: vllm/vllm-openai:latest
    env_file:
    - .env
    restart: unless-stopped
    container_name: vllm-engine
    ports:
      - "8005:8005"
    runtime: nvidia
    environment:
      # --- ADD YOUR HF TOKEN HERE ---
      - HF_API_TOKEN=${HF_TOKEN}
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      # This mounts your host's HF cache so the container doesn't re-download the model
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-14B-AWQ
      --dtype auto
      --api-key ${VLLM_API_KEY}
      --port 8005
      --host 0.0.0.0
      --gpu-memory-utilization ${GPU_MEM_UTIL}
      --max-model-len ${MAX_MODEL_LEN}

  # 1b. EMBEDDINGS SERVICE (bge-m3, dense 1024-dim) — Step 2
  #     Serves /embed over HTTP, exactly like vLLM serves the LLM.
  #     Used by BOTH ingestion (host -> localhost:8090) and the app
  #     (container -> http://tei-embeddings:80). Same model both sides.
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    restart: unless-stopped
    container_name: tei-embeddings
    ports:
      - "8090:80"
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - tei_data:/data          # model weights cached here (downloaded once)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-m3
      --auto-truncate
      --max-batch-tokens 16384

  # 1c. RERANKER SERVICE (bge-reranker-v2-m3, cross-encoder) — Step 2
  #     Serves /rerank; scores (query, chunk) pairs to re-order candidates.
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    restart: unless-stopped
    container_name: tei-reranker
    ports:
      - "8091:80"
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - tei_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-reranker-v2-m3
      --auto-truncate
      --max-batch-tokens 16384

  # 2. THE VECTOR DATABASE
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-gptforyouth
    ports:
      - "6343:6333"
      - "6344:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 3. THE STREAMLIT UI
  streamlit-ui:
    build: .
    restart: unless-stopped
    container_name: streamlit-gptforyouth
    ports:
      - "8505:8505" 
    environment:
      - RUNNING_IN_DOCKER=true
      # 172.17.0.1 is usually the host IP in Docker's default bridge network
      - HOST_IP=172.17.0.1
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      - .:/app  # This syncs local files with the container in real-time
    depends_on:
      - vllm-engine
      - qdrant
      - tei-embeddings
      - tei-reranker

volumes:
  tei_data:
