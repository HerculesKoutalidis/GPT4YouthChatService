version: '3.8'

services:
  # 1. THE LLM ENGINE
  vllm-engine:
    image: vllm/vllm-openai:latest
    env_file:
    - .env
    restart: unless-stopped
    container_name: vllm-engine
    ports:
      - "8005:8005"
    runtime: nvidia
    environment:
      # --- ADD YOUR HF TOKEN HERE ---
      - HF_API_TOKEN=${HF_TOKEN}
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      # This mounts your host's HF cache so the container doesn't re-download the model
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-14B-AWQ
      --dtype auto
      --api-key ${VLLM_API_KEY}
      --port 8005
      --host 0.0.0.0
      --gpu-memory-utilization ${GPU_MEM_UTIL}
      --max-model-len ${MAX_MODEL_LEN}

  # 1b. EMBEDDINGS SERVICE (bge-m3, dense 1024-dim) — Step 2
  #     Serves /embed over HTTP, exactly like vLLM serves the LLM.
  #     Used by BOTH ingestion (host -> localhost:8090) and the app
  #     (container -> http://tei-embeddings:80). Same model both sides.
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    restart: unless-stopped
    container_name: tei-embeddings
    ports:
      - "8090:80"
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - tei_data:/data          # model weights cached here (downloaded once)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-m3
      --auto-truncate
      --max-batch-tokens 16384

  # 1c. RERANKER SERVICE (bge-reranker-v2-m3, cross-encoder) — Step 2
  #     Serves /rerank; scores (query, chunk) pairs to re-order candidates.
  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    restart: unless-stopped
    container_name: tei-reranker
    ports:
      - "8091:80"
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - tei_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-reranker-v2-m3
      --auto-truncate
      --max-batch-tokens 16384

  # 2. THE VECTOR DATABASE
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-gptforyouth
    ports:
      - "6343:6333"
      - "6344:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 3. THE STREAMLIT UI
  streamlit-ui:
    build: .
    restart: unless-stopped
    container_name: streamlit-gptforyouth
    expose:
      - "8505"
    environment:
      - RUNNING_IN_DOCKER=true
      - HOST_IP=172.17.0.1
      - VLLM_API_KEY=${VLLM_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - qdrant
      - vllm-engine    
      - tei-embeddings    
      - tei-reranker       

  # 4. OAUTH2 PROXY (authentication layer in front of Streamlit)
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy-gpt4youth
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: "keycloak-oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://keycloak.toolbox.epu.ntua.gr/realms/GPT4YOUTH1"
      OAUTH2_PROXY_CLIENT_ID: "chatbot_service"
      OAUTH2_PROXY_CLIENT_SECRET: "${KC_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_COOKIE_SECRET}"
      OAUTH2_PROXY_REDIRECT_URL: "https://gpt4youth.gpu.epu.ntua.gr/oauth2/callback"
      OAUTH2_PROXY_UPSTREAMS: "http://streamlit-ui:8505"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4181"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "keycloak.toolbox.epu.ntua.gr"
      OAUTH2_PROXY_SCOPE: "openid email profile"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES: "account"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
    networks:
      - default
      - keycloak_net
    depends_on:
      - streamlit-ui

networks:
  keycloak_net:
    external: true

volumes:
  tei_data: